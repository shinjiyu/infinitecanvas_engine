# Pull request and master checks.
# `npm ci` runs at the repo root: the npm workspace lockfile lives there,
# and `www/` has no package-lock.json of its own.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  wasm-and-www:
    name: wasm-pack and www build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build crates/wasm
        working-directory: crates/wasm
        run: wasm-pack build --target web --out-dir ../../packages/core/wasm

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Node 20 没有全局 WebSocket（22 起才内置）。压测 CDP 客户端在
          # scripts/cdp.mjs 里回退到 undici，所以这里继续用 20，让 CI 覆盖这条路径。
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        working-directory: www
        run: npm run build

      - name: Benchmark stats tests
        run: node --test scripts/bench-stats.test.mjs scripts/cdp.test.mjs

      - name: Ensure Chrome for the performance smoke
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version || google-chrome-stable --version

      - name: Performance smoke (1k rectangles, no 60 FPS gate)
        run: node scripts/bench.mjs --smoke
