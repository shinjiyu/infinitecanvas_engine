<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfiniteCanvas 接口验收</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #eff3ff;
        margin: 0;
        padding: 32px;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.15);
      }

      h1 {
        margin-top: 0;
        font-size: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }

      .status-card {
        background: #f7f8ff;
        border-radius: 14px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        color: #1f2a44;
      }

      .status-card .value {
        color: #4c51bf;
      }

      .canvas-wrapper {
        margin-bottom: 24px;
      }

      canvas {
        width: 100%;
        height: 520px;
        border-radius: 16px;
        border: 1px solid rgba(76, 81, 191, 0.2);
        background: #0f172a;
      }

      .test-section {
        background: #f9fbff;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
      }

      .test-section h2 {
        margin: 0 0 16px 0;
        font-size: 22px;
        color: #1f2a44;
      }

      .test-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .test-item {
        display: grid;
        grid-template-columns: 1.2fr 2fr 120px;
        gap: 12px;
        align-items: center;
        background: #ffffff;
        border-radius: 12px;
        padding: 12px 16px;
        box-shadow: inset 0 0 0 1px rgba(99, 102, 241, 0.12);
      }

      .test-status {
        border-radius: 20px;
        padding: 6px 12px;
        text-align: center;
        font-weight: 600;
      }

      .status-wait {
        background: rgba(99, 102, 241, 0.15);
        color: #4338ca;
      }

      .status-pass {
        background: rgba(19, 194, 150, 0.2);
        color: #0f9d58;
      }

      .status-fail {
        background: rgba(240, 72, 72, 0.18);
        color: #b91c1c;
      }

      .log-panel {
        background: #0f172a;
        border-radius: 14px;
        padding: 16px;
        max-height: 220px;
        overflow-y: auto;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      }

      .log-entry {
        margin: 0;
        padding: 4px 0;
        border-bottom: 1px solid rgba(226, 232, 240, 0.08);
        font-size: 13px;
      }

      .log-entry:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🧪 InfiniteCanvas 自动渲染演示</h1>

      <div class="status-grid">
        <div class="status-card">
          <span>引擎状态</span>
          <span class="value" id="engine-status">初始化中...</span>
        </div>
        <div class="status-card">
          <span>WASM 模块</span>
          <span class="value" id="wasm-status">加载中...</span>
        </div>
        <div class="status-card">
          <span>纹理状态</span>
          <span class="value" id="texture-status">未加载</span>
        </div>
        <div class="status-card">
          <span>渲染流程</span>
          <span class="value" id="render-status">等待测试</span>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="test-canvas" width="960" height="520"></canvas>
      </div>

      <div class="status-grid" style="margin-top: -10px;">
        <div class="status-card">
          <span>元素数量</span>
          <span class="value" id="stat-elements">0</span>
        </div>
        <div class="status-card">
          <span>纹理数量</span>
          <span class="value" id="stat-textures">0</span>
        </div>
        <div class="status-card">
          <span>Zoom</span>
          <span class="value" id="stat-zoom">1.0</span>
        </div>
        <div class="status-card">
          <span>视口中心</span>
          <span class="value" id="stat-center">(0, 0)</span>
        </div>
      </div>

      <div class="test-section">
        <h2>测试项目</h2>
        <div class="test-list" id="test-list"></div>
      </div>

      <div class="test-section">
        <h2>日志</h2>
        <div class="log-panel" id="action-log"></div>
      </div>
    </div>

    <script type="module" src="./test-all-interfaces.js"></script>
  </body>
</html>
