<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfiniteCanvas - 压力测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
    header { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: #f24040; }
    .canvas-wrapper {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    #canvas { display: block; width: 1200px; height: 700px; }
    .controls {
      display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-family: inherit;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-add { background: #36d399; color: #000; }
    .btn-add:hover { background: #4ae0a8; }
    .btn-clear { background: #f24040; color: #fff; }
    .btn-clear:hover { background: #ff5555; }
    .stats-panel {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: rgba(10, 10, 15, 0.95);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      min-width: 200px;
      font-size: 0.85rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .stat-label { color: #888; }
    .stat-value { color: #36d399; font-weight: bold; }
    .stat-value.warning { color: #f2c94c; }
    .stat-value.danger { color: #f24040; }
    .fps-bar {
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .fps-bar-fill {
      height: 100%;
      background: #36d399;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥 压力测试 - Stress Test</h1>
    </header>
    
    <div class="canvas-wrapper">
      <canvas id="canvas" width="1200" height="700"></canvas>
    </div>
    
    <div class="controls">
      <button class="btn-add" onclick="loadCount(1000)">1k</button>
      <button class="btn-add" onclick="loadCount(10000)">10k</button>
      <button class="btn-add" onclick="loadCount(100000)">100k</button>
      <button class="btn-add" onclick="nudgePan()">平移一下</button>
      <button class="btn-clear" onclick="clearAll()">清空</button>
    </div>
    <p style="margin-top: 0.75rem; color: #888; font-size: 0.8rem; max-width: 720px;">
      帧时间是 CPU 提交耗时。本环境若是软件渲染，GPU 帧时间不作数。
      平移/缩放之后 geometryUnchanged 应为 true，重生成元素应为 0。
    </p>
  </div>
  
  <div class="stats-panel">
    <div class="stat-row">
      <span class="stat-label">帧时间:</span>
      <span class="stat-value" id="frame-time">-- ms</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">FPS:</span>
      <span class="stat-value" id="fps">--</span>
    </div>
    <div class="fps-bar">
      <div class="fps-bar-fill" id="fps-bar" style="width: 100%"></div>
    </div>
    <div class="stat-row" style="margin-top: 1rem;">
      <span class="stat-label">元素数:</span>
      <span class="stat-value" id="element-count">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">帧计数:</span>
      <span class="stat-value" id="frame-count">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">顶点数:</span>
      <span class="stat-value" id="vertex-count">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">绘制调用:</span>
      <span class="stat-value" id="draw-calls">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">重生成:</span>
      <span class="stat-value" id="regenerated">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">顶点写入:</span>
      <span class="stat-value" id="gpu-bytes">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">仅 uniform:</span>
      <span class="stat-value" id="uniform-only">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">选中数:</span>
      <span class="stat-value" id="selection-count">0</span>
    </div>
  </div>
  
  <script type="module">
    import init, { InfiniteCanvas } from '../packages/core/wasm/infinitecanvas_wasm.js';
    
    let canvas;
    let wasmCanvas;
    
    // FPS 计算
    let frameCount = 0;
    let lastTime = performance.now();
    let fps = 60;
    
    async function main() {
      try {
        await init();
        wasmCanvas = new InfiniteCanvas();
        
        canvas = document.getElementById('canvas');
        await wasmCanvas.init(canvas);
        
        // 绑定鼠标事件
        bindPointerEvents(canvas, wasmCanvas);
        
        // 渲染循环
        const frameSamples = [];
        function renderLoop() {
          const frameStart = performance.now();
          wasmCanvas.render();
          const frameMs = performance.now() - frameStart;
          frameSamples.push(frameMs);
          if (frameSamples.length > 30) frameSamples.shift();
          const avg = frameSamples.reduce((sum, value) => sum + value, 0) / frameSamples.length;
          document.getElementById('frame-time').textContent =
            frameMs.toFixed(2) + ' ms (avg ' + avg.toFixed(2) + ')';
          
          // FPS 计算
          frameCount++;
          const now = performance.now();
          if (now - lastTime >= 500) {
            fps = Math.round((frameCount * 1000) / (now - lastTime));
            frameCount = 0;
            lastTime = now;
            
            // 更新 FPS 显示
            const fpsEl = document.getElementById('fps');
            fpsEl.textContent = fps;
            fpsEl.className = 'stat-value' + (fps < 30 ? ' danger' : fps < 50 ? ' warning' : '');
            
            // FPS 条
            const fpsBar = document.getElementById('fps-bar');
            fpsBar.style.width = Math.min(100, fps / 60 * 100) + '%';
            fpsBar.style.background = fps < 30 ? '#f24040' : fps < 50 ? '#f2c94c' : '#36d399';
          }
          
          // 更新统计
          const stats = wasmCanvas.get_performance_stats();
          document.getElementById('element-count').textContent = stats.elementCount.toLocaleString();
          document.getElementById('frame-count').textContent = stats.frameCount.toLocaleString();
          document.getElementById('vertex-count').textContent = stats.vertexCount.toLocaleString();
          document.getElementById('draw-calls').textContent = stats.drawCalls;
          document.getElementById('regenerated').textContent = stats.regeneratedElements;
          document.getElementById('gpu-bytes').textContent = Math.round(stats.gpuBytesWritten).toLocaleString();
          document.getElementById('uniform-only').textContent = stats.geometryUnchanged ? 'yes' : 'no';
          document.getElementById('selection-count').textContent = wasmCanvas.get_selection_count();
          
          requestAnimationFrame(renderLoop);
        }
        renderLoop();
        
        console.log('✅ Stress test initialized');
        
      } catch (error) {
        console.error('❌ Failed to initialize:', error);
      }
    }
    
    function bindPointerEvents(canvas, wasm) {
      canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        wasm.handle_pointer_event('down', e.pointerId,
          e.clientX - rect.left, e.clientY - rect.top,
          e.movementX, e.movementY, e.button, e.buttons,
          e.shiftKey, e.ctrlKey, e.altKey, e.metaKey);
        canvas.setPointerCapture(e.pointerId);
      });
      
      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        wasm.handle_pointer_event('move', e.pointerId,
          e.clientX - rect.left, e.clientY - rect.top,
          e.movementX, e.movementY, e.button, e.buttons,
          e.shiftKey, e.ctrlKey, e.altKey, e.metaKey);
      });
      
      canvas.addEventListener('pointerup', (e) => {
        const rect = canvas.getBoundingClientRect();
        wasm.handle_pointer_event('up', e.pointerId,
          e.clientX - rect.left, e.clientY - rect.top,
          e.movementX, e.movementY, e.button, e.buttons,
          e.shiftKey, e.ctrlKey, e.altKey, e.metaKey);
        canvas.releasePointerCapture(e.pointerId);
      });
      
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    
    window.loadCount = function(count) {
      const startTime = performance.now();
      wasmCanvas.load_stress_scene(count);
      const elapsed = performance.now() - startTime;
      console.log(`Loaded ${count} rectangles in ${elapsed.toFixed(1)}ms`);
    };

    window.nudgePan = function() {
      wasmCanvas.pan(24, 16);
    };
    
    window.clearAll = function() {
      wasmCanvas.clear_scene();
    };
    
    main();
  </script>
</body>
</html>
